name: Build Android debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Capacitor 8 requires Node 22 or newer.
          node-version: '22'
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          # Capacitor 8 compiles against Java 21.
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Install client dependencies
        run: npm ci

      # Builds with .env.mobile (the Render API URL) and copies dist into android/.
      - name: Build mobile web assets and sync Android
        run: npm run build:mobile

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Assemble debug APK
        run: ./gradlew assembleDebug
        working-directory: client/android

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: fams-debug-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
